services:
  - type: web
    name: heart-memo-vault-api
    env: node
    plan: free
    region: singapore # or oregon, frankfurt
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: MONGODB_URI
        sync: false
      - key: PORT
        value: 10000
